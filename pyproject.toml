[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbomachinery-degradation-lstm"
version = "1.0.0"
description = "Deep Time-Series Prognostics & Remaining Useful Life (RUL) Estimation for Turbomachinery on NASA C-MAPSS"
readme = "README.md"
authors = [{ name = "Mohammed Basra", email = "mohammedbasra.star@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
]

[project.urls]
"Homepage" = "https://github.com/mohammedbasra-star/turbomachinery-degradation-lstm"
"Repository" = "https://github.com/mohammedbasra-star/turbomachinery-degradation-lstm.git"
